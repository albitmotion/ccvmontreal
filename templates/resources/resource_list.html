<div class="col-md-12 shadow-lg rounded div-info" id="meetings_list">
  <h3>
    <span lang="en">Resources</span><span lang="fr">Ressources</span>

  </h3>
  <input type="text" class="form-control" id="meeting-search-input" onkeyup="filterMeeting()" placeholder="Search" />
  <table class="table" id="meetingTable">
    <thead>
      <tr>
        <th class="firstCol" scope="col">
          <span lang="en">Name</span><span lang="fr">Date</span>
        </th>
        <th scope="col">
          <span lang="en">URL</span><span lang="fr">Minute</span>
        </th>
        <th scope="col">
          <span lang="en">Edit</span><span lang="fr">Modifier</span>
        </th>
      </tr>
    </thead>
    {% for resource in resources %}
    <tr>
      <td class="firstCol">{{ resource.nameEN }}</td>
      <td>{{ resource.url }}</td>
      <td><button class="btn" style="padding:0px" data-bs-toggle="modal" data-bs-target="#defaultModal"
          data-bs-url="{{ url_for('update_resource', id=resource.id) }}"
          data-bs-title="Update Resource {{ resource.nameEN }}"><i class="bi bi-gear"></i></button></td>
    </tr>
    
    {% endfor %}
  </table>
  <div class="d-flex justify-content-between">
    <div></div>
    <div>
      <button class="btn blueButton" style="width:100%" data-bs-toggle="modal" data-bs-target="#defaultModal"
        data-bs-url="{{ url_for('add_resource') }}" data-bs-title="Add New Resource">
        <span lang="en">Add New Resource</span><span lang="fr">Ajouter une nouvelle Ressource</span>

      </button>
    </div>
  </div>

</div>
