<div class="col-md-12 shadow-lg rounded div-info" id="surveysList">
   <h3>
     <span lang="en">Surveys</span><span lang="fr">Enquêtes</span>

   </h3>
   <input type="text" class="form-control" id="survey-search-input" onkeyup="filterSurvey()" placeholder="Search"/>
   <table class="table" id="surveyTable">
   <thead>
     <tr>
       <th scope="col" class="firstCol">
         <span lang="en">Title</span><span lang="fr">Titre</span>
         </th>
       <th scope="col">
         <span lang="en">Start</span><span lang="fr">Commencer</span>
         </th>
       <th scope="col">
         <span lang="en">End</span><span lang="fr">Fin</span>
         </th>
       <th scope="col">
         <span lang="en">Responders</span><span lang="fr">Répondants</span>
         </th>
       <th scope="col">
         <span lang="en">Result</span><span lang="fr">Résultat</span>
         </th>
       <th scope="col">
         <span lang="en">Edit</span><span lang="fr">Modifier</span>
         </th>
     </tr>
   </thead>
   {% for survey in surveys %}
     <tr>
       <td class="firstCol">{{ survey.title }}</td>
       <td>{{ survey.start}}</td>
       <td>{{ survey.end}}</td>
       <td>{{ survey.responders}}</td>
       <td>
         <a target="_blank" href="{{ s3_root }}/docs/surveys/{{ survey.file|string}}">
         <i class="bi-box-arrow-down"></i>
         </a>
       </td>
       <td><button class="btn" style="padding:0px" data-bs-toggle="modal" data-bs-target="#defaultModal" data-bs-url="{{ url_for('update_survey', id=survey.id) }}" data-bs-title="Update Survey {{ survey.title }}"><i class="bi bi-gear"></i></button></td>
     </tr>
   {% endfor %}
   </table>
   <div class="d-flex justify-content-between">
       <div></div>
       <div>
         <button class="btn blueButton" style="padding:0px" data-bs-toggle="modal" data-bs-target="#defaultModal" data-bs-url="{{ url_for('add_survey') }}" data-bs-title="Add New Survey">
           <span lang="en">Add New Survey</span><span lang="fr">Ajouter une nouvelle enquête</span>

         </button>
       </div>
  </div>

</div>
