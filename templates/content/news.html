<div class="col-md-12 shadow-lg rounded div-info" id="news">
  <h3>
    <span lang="en">News</span><span lang="fr">Nouvelles</span>

  </h3>

  <table class="table" id="usersTable">
    <thead>
      <tr>
        <th scope="col" class="firstCol">
          <span lang="en">Image</span><span lang="fr">Image</span>
          </th>
        <th scope="col" class="firstCol">
          <span lang="en">New</span><span lang="fr">Nouvelle</span>
          </th>
        <th scope="col">
          <span lang="en">Type</span><span lang="fr">Type</span>
          </th>
        <th scope="col">
          <span lang="en">Edit</span><span lang="fr">Modifier</span>
          </th>
      </tr>
    </thead>
  {% for new in news %}

    <tr>
      {% if new.file %}
      <td class="firstCol" style="width:150px"><img class="photo_list_square" src="{{ s3_root }}/images/news/{{  new.file|string }}"></td>
      {% else %}
       <td></td>
      {% endif %}
      <td class="firstCol">{{ new.title }}</td>
      <td>{{ new.type }}</td>
      <td><button class="btn" style="padding:0px" data-bs-toggle="modal" data-bs-target="#defaultModal" data-bs-url="{{ url_for('update_news', id=new.id) }}" data-bs-title="Update Member {{ new.title }}"><i class="bi bi-gear"></i></button></td>
    </tr>
  {% endfor %}
  </table>
  <div class="d-flex justify-content-between">
      <div></div>
      <div>
        <button class="btn blueButton" style="padding:0px" data-bs-toggle="modal" data-bs-target="#defaultModal" data-bs-url="{{ url_for('add_news') }}" data-bs-title="Add New News">
          <span lang="en">Add New News</span><span lang="fr">Ajouter de nouvelles nouvelles</span>
        </button>
      </div>
 </div>

  </div>
